name: Generar Noticias Automáticas + Deploy FTP

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-noticias:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar generador de noticias
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python generar_noticias.py

    - name: Commit y push de estado
      run: |
        git config user.name "TikPanel Bot"
        git config user.email "bot@tikpanel.app"
        git add noticias/ estado_noticias.json
        if git diff --staged --quiet; then
          echo "No hay cambios nuevos"
        else
          git commit -m "🤖 Noticias automáticas: $(date +%Y-%m-%d)"
          git push
        fi

    - name: Deploy vía FTP a Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: 82.29.185.65
        username: u208113460.github
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        local-dir: ./noticias/
        server-dir: /noticias/
        log-level: verbose

        local-dir: ./noticias/
        server-dir: /noticias/
        log-level: verbose
