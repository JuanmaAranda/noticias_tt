name: Generar Noticias Automáticas + Deploy FTP

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  generar-noticias:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Ejecutar generador de noticias
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python generar_noticias.py
    
    - name: Verificar archivos generados
      run: |
        echo "=== Contenido de noticias/ ==="
        ls -la noticias/ || echo "Carpeta noticias/ no encontrada"
    
    - name: Deploy vía FTP a Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: 82.29.185.65
        username: u208113460.github
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./noticias/
        server-dir: /public_html/noticias/
        log-level: verbose
