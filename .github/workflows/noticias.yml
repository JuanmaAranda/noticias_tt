name: Generar Noticias Automáticas + Deploy FTP

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-noticias:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar generador de noticias (con reintentos automáticos)
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 15
        max_attempts: 5
        retry_wait_seconds: 300
        command: |
          python generar_noticias.py
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    - name: Commit y push de estado
      run: |
        git config user.name "TikPanel Bot"
        git config user.email "bot@tikpanel.app"
        git add noticias/ estado_noticias.json
        if git diff --staged --quiet; then
          echo "No hay cambios nuevos"
        else
          git commit -m "🤖 Noticias automáticas: $(date +%Y-%m-%d)"
          git push
        fi

    - name: Instalar lftp
      run: sudo apt-get install -y lftp

    - name: Subir noticias por FTP
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 60
        command: |
          lftp -u "u208113460.github,${{ secrets.FTP_PASSWORD }}" 82.29.185.65 <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:ssl-protect-list yes
          set net:timeout 30
          set net:max-retries 3
          mirror -R -p --delete -v noticias/ /noticias/
          bye
          EOF
