name: Generar Noticias Automáticas + Deploy FTP

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-noticias:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Descargar lista de borradas y feeds desde el servidor
      run: |
        curl -s -o panel/borradas.txt "https://tikpanel.app/panel/borradas.txt" || echo "No hay borradas.txt"
        curl -s -o feeds.json "https://tikpanel.app/feeds.json" || echo "No hay feeds.json, usando por defecto"
        # Si feeds.json está vacío, eliminarlo para usar defaults
        if [ ! -s feeds.json ]; then
          rm -f feeds.json
          echo "feeds.json vacío o no encontrado, se usarán feeds por defecto"
        fi

    - name: Ejecutar generador de noticias
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python generar_noticias.py

    - name: Leer resumen de ejecución
      id: resumen
      run: |
        if [ -f resumen_ejecucion.json ]; then
          ESTADO=$(python -c "import json; d=json.load(open('resumen_ejecucion.json')); print(d.get('estado','desconocido'))")
          NOTICIAS=$(python -c "import json; d=json.load(open('resumen_ejecucion.json')); print(d.get('noticias_generadas',0))")
          ERRORES=$(python -c "import json; d=json.load(open('resumen_ejecucion.json')); print(len(d.get('errores',[])))")
          echo "estado=$ESTADO" >> $GITHUB_OUTPUT
          echo "noticias=$NOTICIAS" >> $GITHUB_OUTPUT
          echo "errores=$ERRORES" >> $GITHUB_OUTPUT
        else
          echo "estado=error" >> $GITHUB_OUTPUT
          echo "noticias=0" >> $GITHUB_OUTPUT
          echo "errores=1" >> $GITHUB_OUTPUT
        fi

    - name: Enviar email de notificación
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "📰 TikPanel Noticias - ${{ steps.resumen.outputs.estado == 'ok' && 'Nuevas noticias generadas' || steps.resumen.outputs.estado == 'sin_noticias' && 'Sin noticias nuevas' || 'Error en ejecución' }}"
        to: ${{ secrets.EMAIL_TO }}
        from: "TikPanel Bot <${{ secrets.EMAIL_USERNAME }}>"
        html_body: |
          <h2>📰 Resumen de ejecución - TikPanel Noticias</h2>
          <p><strong>Estado:</strong> ${{ steps.resumen.outputs.estado }}</p>
          <p><strong>Noticias generadas:</strong> ${{ steps.resumen.outputs.noticias }}</p>
          <p><strong>Errores:</strong> ${{ steps.resumen.outputs.errores }}</p>
          <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Ver detalles en GitHub Actions</a></p>

    - name: Commit y push de estado
      run: |
        git config user.name "TikPanel Bot"
        git config user.email "bot@tikpanel.app"
        git add noticias/ estado_noticias.json
        if git diff --staged --quiet; then
          echo "No hay cambios nuevos"
        else
          git commit -m "🤖 Noticias automáticas: $(date +%Y-%m-%d)"
          git push
        fi

    - name: Instalar lftp
      run: sudo apt-get install -y lftp

    - name: Subir noticias por FTP
      run: |
        lftp -u "u208113460.github,${{ secrets.FTP_PASSWORD }}" 82.29.185.65 <<EOF
        set ssl:verify-certificate no
        set ftp:ssl-allow yes
        set ftp:ssl-force yes
        set ftp:ssl-protect-data yes
        set ftp:ssl-protect-list yes
        set net:timeout 30
        set net:max-retries 3
        mirror -R -p noticias/ /noticias/
        bye
        EOF
