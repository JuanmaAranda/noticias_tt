name: Generar Noticias Automáticas + Deploy FTP

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-noticias]

permissions:
  contents: write

jobs:
  generar-noticias:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Descargar lista de borradas, pendientes e ignoradas desde el servidor
      continue-on-error: true
      timeout-minutes: 1
      run: |
        # Crear directorio panel si no existe
        mkdir -p panel
        # Descargar borradas.txt
        curl -fsSL --connect-timeout 10 -o panel/borradas.txt "https://tikpanel.app/panel/borradas.txt" || echo "No hay borradas.txt"
        # Descargar borradas.json (títulos completos de noticias borradas)
        curl -fsSL --connect-timeout 10 -o panel/borradas.json "https://tikpanel.app/panel/borradas.json" && echo "borradas.json descargado del servidor" || echo "No hay borradas.json en el servidor"
        # Descargar pendientes.json del servidor para no duplicar
        curl -fsSL --connect-timeout 10 -o pendientes.json "https://tikpanel.app/panel/pendientes.json" && echo "pendientes.json descargado del servidor" || echo "No hay pendientes.json en el servidor, iniciando desde cero"
        if [ ! -s pendientes.json ]; then
          echo "[]" > pendientes.json
          echo "pendientes.json inicializado vacío"
        fi
        # Descargar ignoradas.json del servidor
        curl -fsSL --connect-timeout 10 -o ignoradas.json "https://tikpanel.app/panel/ignoradas.json" && echo "ignoradas.json descargado del servidor" || echo "No hay ignoradas.json en el servidor, iniciando desde cero"
        if [ ! -s ignoradas.json ]; then
          echo "[]" > ignoradas.json
          echo "ignoradas.json inicializado vacío"
        fi
        # Descargar noticias publicadas del servidor para deduplicación
        curl -fsSL --connect-timeout 10 -o noticias_servidor.html "https://tikpanel.app/noticias/" || echo "No se pudo descargar listado de noticias"
        if [ -f noticias_servidor.html ]; then
          echo "Listado de noticias del servidor descargado"
        fi

    - name: Verificar secrets
      run: |
        echo "OPENAI_API_KEY está configurado: ${{ secrets.OPENAI_API_KEY != '' }}"
        echo "GEMINI_API_KEY está configurado: ${{ secrets.GEMINI_API_KEY != '' }}"

    - name: Ejecutar recolector de noticias
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generar_noticias.py

    - name: Leer resumen de ejecución
      id: resumen
      run: |
        if [ -f resumen_ejecucion.json ]; then
          ESTADO=$(python -c "import json; d=json.load(open('resumen_ejecucion.json')); print(d.get('estado','desconocido'))")
          URLS=$(python -c "import json; d=json.load(open('resumen_ejecucion.json')); print(d.get('urls_encontradas',0))")
          ERRORES=$(python -c "import json; d=json.load(open('resumen_ejecucion.json')); print(len(d.get('errores',[])))")
          echo "estado=$ESTADO" >> $GITHUB_OUTPUT
          echo "urls=$URLS" >> $GITHUB_OUTPUT
          echo "errores=$ERRORES" >> $GITHUB_OUTPUT
        else
          echo "estado=error" >> $GITHUB_OUTPUT
          echo "urls=0" >> $GITHUB_OUTPUT
          echo "errores=1" >> $GITHUB_OUTPUT
        fi

    - name: Enviar email de notificación
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "📰 TikPanel Noticias - ${{ steps.resumen.outputs.estado == 'ok' && 'Nuevas URLs encontradas' || steps.resumen.outputs.estado == 'sin_nuevas' && 'Sin nuevas URLs' || 'Error en ejecución' }}"
        to: ${{ secrets.EMAIL_TO }}
        from: "TikPanel Bot <${{ secrets.EMAIL_USERNAME }}>"
        html_body: |
          <h2>📰 Resumen de ejecución - TikPanel Noticias</h2>
          <p><strong>Estado:</strong> ${{ steps.resumen.outputs.estado }}</p>
          <p><strong>Nuevas URLs encontradas:</strong> ${{ steps.resumen.outputs.urls }}</p>
          <p><strong>Errores:</strong> ${{ steps.resumen.outputs.errores }}</p>
          <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Ver detalles en GitHub Actions</a></p>

    - name: Commit y push de pendientes.json, ignoradas.json y borradas.txt al repo (backup)
      run: |
        git config user.name "TikPanel Bot"
        git config user.email "bot@tikpanel.app"
        git add pendientes.json ignoradas.json panel/borradas.txt panel/borradas.json
        if git diff --staged --quiet; then
          echo "No hay cambios nuevos"
        else
          git commit -m "🤖 URLs pendientes e ignoradas actualizadas: $(date +%Y-%m-%d)"
          git push
        fi

    - name: Subir pendientes.json e ignoradas.json al servidor (HTTPS, bot_upload.php)
      continue-on-error: true
      run: |
        subir() {
          local archivo_local="$1"
          local ruta_remota="$2"
          local http_code
          http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.BOT_UPLOAD_TOKEN }}" \
            --data-binary "@${archivo_local}" \
            "https://tikpanel.app/panel/bot_upload.php?path=${ruta_remota}")
          echo "→ ${ruta_remota}: HTTP ${http_code} $(cat /tmp/resp.json)"
          if [ "$http_code" != "200" ]; then
            echo "⚠️ Fallo subiendo ${ruta_remota}"
          fi
        }
        subir pendientes.json panel/pendientes.json
        subir ignoradas.json panel/ignoradas.json

    - name: Eliminar index.html del servidor para forzar index.php dinámico
      continue-on-error: true
      run: |
        http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
          -X DELETE \
          -H "Authorization: Bearer ${{ secrets.BOT_UPLOAD_TOKEN }}" \
          "https://tikpanel.app/panel/bot_upload.php?path=noticias/index.html")
        echo "→ borrar index.html: HTTP ${http_code} $(cat /tmp/resp.json)"

    - name: Subir noticias nuevas al servidor (HTTPS, bot_upload.php)
      continue-on-error: true
      run: |
        shopt -s nullglob
        for f in noticias/*.html; do
          nombre=$(basename "$f")
          if [ "$nombre" = "index.html" ]; then continue; fi
          nombre_encoded=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))" "$nombre")
          http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.BOT_UPLOAD_TOKEN }}" \
            --data-binary "@${f}" \
            "https://tikpanel.app/panel/bot_upload.php?path=noticias/${nombre_encoded}")
          echo "→ noticias/${nombre}: HTTP ${http_code} $(cat /tmp/resp.json)"
        done
